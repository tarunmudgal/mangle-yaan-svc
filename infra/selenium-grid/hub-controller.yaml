apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium-hub-deployment
  namespace: ara-mangle-yaan
  labels:
    name: selenium-hub
    app: selenium-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selenium-hub
  template:
    metadata:
      labels:
        app: selenium-hub
    spec:
      containers:
        - name: selenium-hub
          image: harbor-repo.vmware.com/csp_qe/selenium/hub:3.14
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 4444
              protocol: TCP
          resources:
            requests:
              memory: "2048M"
              cpu: "1000m"
            limits:
              memory: "2048M"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /wd/hub/status
              port: 4444
            initialDelaySeconds: 300
            timeoutSeconds: 20
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /wd/hub/status
              port: 4444
            initialDelaySeconds: 10
            timeoutSeconds: 20
            periodSeconds: 10
          env:
            - name: JAVA_OPTS
              value: "-Xmx1024m"
            - name: POOL_MAX
              value: "500"
            - name: GRID_NEW_SESSION_WAIT_TIMEOUT
              value: "-1"
            - name: GRID_JETTY_MAX_THREADS
              value: "-1"
            - name: GRID_NODE_POLLING
              value: "5000"
            - name: GRID_CLEAN_UP_CYCLE
              value: "5000"
            - name: GRID_TIMEOUT
              value: "600"
            - name: GRID_BROWSER_TIMEOUT
              value: "600"
            - name: GRID_MAX_SESSION
              value: "5"
            - name: GRID_UNREGISTER_IF_STILL_DOWN_AFTER
              value: "30000"
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory