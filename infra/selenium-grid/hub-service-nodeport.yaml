apiVersion: v1
kind: Service
metadata:
  name: selenium-hub-svc
  namespace: ara-mangle-yaan
  labels:
    app: selenium-hub
spec:
  type: NodePort
  ports:
    - name: web
      protocol: TCP
      port: 4444
      targetPort: 4444
      nodePort: 31001
  selector:
    app: selenium-hub
  sessionAffinity: None