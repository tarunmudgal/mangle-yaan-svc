apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: commerce-deny-external-egress
spec:
  podSelector:
    matchLabels:
      app: csp-commerce
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 8060
      protocol: TCP
    to:
    - namespaceSelector: {}