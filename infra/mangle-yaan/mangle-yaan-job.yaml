apiVersion: batch/v1
kind: Job
metadata:
  name: mangle-yaan-job
spec:
  template:
    spec:
      containers:
      - name: mangle-yaan-job
        image: vmware-docker-csp-tools.bintray.io/mangle-yaan:latest
        imagePullPolicy: Always
        env:
          - name: PROJECT_NAME
            value: "MANGLE_YAAN_TEST"
          - name: WORKLOAD_NAME
            value: "Test-workload"
          - name: TESTSUITE_NAMES
            value: "test_onboarding_api_when_a_service_down"
          - name: PYTEST_ARGS
            value: ""
          - name: MYCONFIG
            value: ""
          - name: run_id
            value: ""
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      restartPolicy: "Never"
      imagePullSecrets:
      - name: mangle-yaan-secret
  backoffLimit: 3
