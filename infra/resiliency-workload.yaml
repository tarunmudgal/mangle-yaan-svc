apiVersion: batch/v1
kind: Job
metadata:
  name: csp-resiliency-tests
spec:
  template:
    spec:
      containers:
      - name: csp-resiliency-tests
        image: mangle-yaan:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: project_name
            value: "csp_resiliency"
          - name: workload_name
            value: "cpu_spike"
          - name: run_id
            value: "abcd"
          - name: TESTRUNNER_PARAMS
            value: "/mangle-yaan/tests/test_dummy.py"
        resources:
          limits:
            memory: "1Gi"
      restartPolicy: "Never"
      imagePullSecrets:
      - name: maxim-bintray
  backoffLimit: 0