apiVersion: batch/v1
kind: Job
metadata:
  name: csp-resiliency-tests
spec:
  template:
    spec:
      containers:
      - name: csp-resiliency-tests
        image: vmware-docker-csp-tools.bintray.io/csp-resiliency-tests:latest
        env:
          - name: type
            value: "pre"
          - name: project_name
            value: "csp_resiliency"
          - name: workload_name
            value: "cpu_spike"
          - name: run_id
            value: "abcd"
        resources:
          limits:
            memory: "4Gi"
      restartPolicy: "Never"
      imagePullSecrets:
      - name: maxim-bintray
  backoffLimit: 0